  clkEl.textContent=fmt(elapsed);
}

/* ---------- 排行榜数据 ---------- */
function sortLB(l){return l.slice().sort((a,b)=> (b.s-a.s) || (a.t-b.t) || (a.d-b.d));}
function mergeLB(a,b){const m=new Map(); a.concat(b).forEach(x=>{if(x&&x.d)m.set(x.d,x);}); return Array.from(m.values());}
function localLB(){try{return JSON.parse(localStorage.getItem('cj_lb_local')||'[]');}catch(e){return [];}}
function saveLocal(rec){
  const l=sortLB(localLB().concat([rec])).slice(0,200);
  try{localStorage.setItem('cj_lb_local',JSON.stringify(l));}catch(e){}
  return l;
}
async function fetchCloud(){
  const r=await fetch(LB_URL,{cache:'no-store'});
  if(!r.ok) throw new Error('bad');
  const j=await r.json();
  return (j&&j.data&&Array.isArray(j.data.list))?j.data.list:[];
}
async function pushCloud(rec){
  // 先读云端当前榜，再与本机+本次成绩合并后写回（读改写，避免覆盖他人成绩）
  // 用默认 cors 模式（非 no-cors），PUT+application/json 才真正能通过预检写入云端
  try{
    const cur=await fetchCloud();
    const list=sortLB(mergeLB(cur, localLB(), [rec])).slice(0,300);
    await fetch(LB_URL,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:LB_NAME,data:{v:1,list:list}})});
    return list;
  }catch(e){
    // 云端暂不可达：只更新本机，不覆盖云端，稍后重试
    return sortLB(mergeLB(localLB(),[rec]));
  }
}

/* ---------- 启动页 ---------- */
function showStart(){
  clearInterval(timerId); timerId=null;
  clearInterval(lbTimer); lbTimer=null;
  hdinfo.classList.remove('show');
  bar.style.width='0%';
  try{const u=JSON.parse(localStorage.getItem('cj_user')||'{}');
      if(u.n) user={n:u.n,sh:u.sh||''};}catch(e){}
  body.innerHTML = `
    <div class="start">
      <div class="big">🔍🍣</div>
      <h2 style="margin:6px 0;color:#1b4fa0">巡检标准闯关</h2>
      <p>每局随机抽 <b>20 道</b>真实巡检题。<br>
         ① 先看照片，判断<b>问题出在哪里</b><br>
         ② 再选<b>正确的做法</b><br>
         成绩相同者，<b>用时越短排名越高</b>。</p>
      <div class="form">
        <label>你的姓名 <span style="color:#f06b6b">*</span></label>
        <input id="inName" maxlength="12" placeholder="请输入姓名" value="${esc(user.n)}">
        <label>门店 / 区域 <span style="color:#f06b6b">*</span></label>
        <input id="inShop" maxlength="18" placeholder="例：广州天河店" value="${esc(user.sh)}">
        <div class="err" id="errN">请先填写姓名，才能上榜哦</div>
        <div class="err" id="errSh">请先填写门店 / 区域，才能上榜哦</div>
      </div>
      <button class="btn" id="goBtn">开始挑战</button>
      <button class="ghost" onclick="showLB('cloud')">🏆 查看排行榜</button>
      ${CLEAR_BTN}
      <div class="tip">手机扫码即玩，无需下载 · 成绩自动上榜</div>
    </div>`;
  document.getElementById('goBtn').onclick=()=>{
    const n=document.getElementById('inName').value.trim();
    const sh=document.getElementById('inShop').value.trim();
    document.getElementById('errN').classList.remove('show');
    document.getElementById('errSh').classList.remove('show');
    if(!n){document.getElementById('errN').classList.add('show');return;}
    if(!sh){document.getElementById('errSh').classList.add('show');return;}
    user={n:n,sh:sh};
    try{localStorage.setItem('cj_user',JSON.stringify(user));}catch(e){}
    startGame();
  };
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---------- 出题 ---------- */
function startGame(){
  quiz = shuffle(BANK.slice()).slice(0, TOTAL);
  idx=0; score=0; myRec=null;
  whoEl.textContent = user.n + (user.sh?(' · '+user.sh):'');
  hdinfo.classList.add('show');
  startTimer();
  renderQuestion();
}

function otherIssue(except){
  const cats = [...new Set(quiz.map(q=>q.cat))];
  let cross = [];
  for (const cat of cats){
    if (cat === cur.cat) continue;
    cross = cross.concat(quiz.filter(q=>q.cat===cat).map(q=>q.issue).filter(s=>s && s!==except));
  }
  const words = (except||'').split(/[^\u4e00-\u9fa5a-zA-Z0-9]+/).filter(w=>w.length>=2);
  const safe = cross.filter(s=>!words.some(w=>s.includes(w)));
  if (safe.length) return safe[Math.floor(Math.random()*safe.length)];
  if (cross.length) return cross[Math.floor(Math.random()*cross.length)];
  const all = quiz.map(q=>q.issue).filter(s=>s && s!==except);
  return all[Math.floor(Math.random()*all.length)] || '其他问题';
}

function renderQuestion(){
  cur = quiz[idx];
  picked1=false; picked2=false;
  bar.style.width = (idx/TOTAL*100)+'%';
  const distract = otherIssue(cur.issue);
  const opts1 = shuffle([{t:cur.issue, ok:true},{t:distract, ok:false}]);
  body.innerHTML = `
    <div class="qmeta">${cur.cat}<span class="qcnt">第 ${idx+1} / ${TOTAL} 题</span></div>
    <div class="stage">① 看图找问题</div>
    <img class="photo" src="photos/${cur.photo}" alt="巡检照片">
    <div class="q">这张巡检照片里，<b>问题出在哪里</b>？</div>
    ${opts1.map((o,i)=>`<button class="opt" data-st="1" data-ok="${o.ok}">${String.fromCharCode(65+i)}. ${o.t}</button>`).join('')}
    <div class="fb" id="fb1"></div>
    <button class="next" id="next1" style="display:none">看正确做法 →</button>
  `;
  body.querySelectorAll('[data-st="1"]').forEach(b=>{ b.onclick=()=>pick1(b); });
}

function pick1(btn){
  if(picked1) return;
  picked1=true;
  const ok = btn.dataset.ok==='true';
  body.querySelectorAll('[data-st="1"]').forEach(b=>{
    b.classList.add(b.dataset.ok==='true'?'ok':'bad');
    if(b!==btn) b.classList.add('dim');
    b.onclick=null;
  });
  const fb=document.getElementById('fb1');
  if(ok){ score++; fb.className='fb show g'; fb.innerHTML='<b>答对了！</b> 问题就是：'+cur.issue; }
  else { fb.className='fb show r'; fb.innerHTML='<b>再想想～</b> 这张照片反映的是：<b>'+cur.issue+'</b>'; }
  const n1=document.getElementById('next1');
  n1.style.display='block'; n1.onclick=renderStage2;
}

function renderStage2(){
  bar.style.width = ((idx+0.5)/TOTAL*100)+'%';
  const opts2 = shuffle([{t:cur.yes, ok:true},{t:cur.no, ok:false}]);
  body.innerHTML = `
    <div class="qmeta">${cur.cat}<span class="qcnt">第 ${idx+1} / ${TOTAL} 题</span></div>
    <div class="stage">② 选正确做法</div>
    <img class="photo" src="photos/${cur.photo}" alt="巡检照片">
    <div class="q">针对上面的问题，<b>正确的做法</b>应该是？</div>
    ${opts2.map((o,i)=>`<button class="opt" data-st="2" data-ok="${o.ok}">${String.fromCharCode(65+i)}. ${o.t}</button>`).join('')}
    <div class="fb" id="fb2"></div>
    <button class="next" id="next2" style="display:none">${idx+1>=TOTAL?'查看成绩 →':'下一题 →'}</button>
  `;
  body.querySelectorAll('[data-st="2"]').forEach(b=>{ b.onclick=()=>pick2(b); });
}

function pick2(btn){
  if(picked2) return;
  picked2=true;
  const ok = btn.dataset.ok==='true';
  body.querySelectorAll('[data-st="2"]').forEach(b=>{
    b.classList.add(b.dataset.ok==='true'?'ok':'bad');
    if(b!==btn) b.classList.add('dim');
    b.onclick=null;
  });
  const fb=document.getElementById('fb2');
  if(ok){ score++; fb.className='fb show g'; fb.innerHTML='<b>正确！</b> '+cur.reason; }
  else { fb.className='fb show r'; fb.innerHTML='<b>不对哦～</b> 正确做法是：'+cur.yes+'<br>'+cur.reason; }
  const nb=document.getElementById('next2');
  nb.style.display='block';
  nb.onclick=()=>{ idx++; if(idx>=TOTAL) showEnd(); else renderQuestion(); };
}

/* ---------- 结算 ---------- */
function rankOf(pct){
  if(pct>=1) return ['标准王者','#2f7bf6'];
  if(pct>=0.8) return ['标准达人','#34c272'];
  if(pct>=0.6) return ['操作能手','#f0a93a'];
  return ['成长新星','#9b6bff'];
}

function showEnd(){
  bar.style.width='100%';
  stopTimer();
  const full=TOTAL*2;
  const [rk,rc]=rankOf(score/full);
  myRec={n:user.n, sh:user.sh, s:score, t:elapsed, d:Date.now()};
  saveLocal(myRec);

  let rev='';
  quiz.forEach(q=>{
    rev += `<div class="rc">
      <img src="photos/${q.photo}">
      <div class="t"><div class="c">${q.cat}</div>
      问题：${q.issue}<br>
      <span class="ok">正确做法：</span>${q.yes}
      <div class="tip">${q.reason}</div></div>
    </div>`;
  });
  body.innerHTML = `
    <div class="end">
      <div class="score">${score}<small> / ${full}</small></div>
      <div class="rank" style="background:${rc}">${rk}</div>
      <div class="kpi">
        <div><div class="v">${fmt(elapsed)}</div><div class="l">总用时</div></div>
        <div><div class="v">${Math.round(score/full*100)}%</div><div class="l">正确率</div></div>
        <div><div class="v" id="myRank">—</div><div class="l">全国排名</div></div>
      </div>
      <p class="tip" id="upTip">正在上传成绩到排行榜…</p>
      <button class="next" onclick="showLB('cloud')">🏆 查看排行榜</button>
      <button class="copy" onclick="copyScore()">复制战绩发群里</button>
      <button class="ghost" onclick="showStart()">再来一局（重新抽题）</button>
      <div class="rev"><h3>全部 ${TOTAL} 题 · 标准答案回顾</h3>${rev}</div>
    </div>`;
  uploadScore();
}

async function uploadScore(){
  const tip=document.getElementById('upTip');
  const rEl=document.getElementById('myRank');
  const list=await pushCloud(myRec);
  const pos=list.findIndex(x=>x.d===myRec.d)+1;
  if(rEl) rEl.textContent = pos>0 ? ('第'+pos) : '—';
  if(tip) tip.innerHTML='成绩已记录 · 共 <b>'+list.length+'</b> 人参与 · 同分按用时短者领先';
}

function copyScore(){
  const txt='我在「苍井寿司巡检标准闯关」拿了 '+score+'/'+(TOTAL*2)+' 分，用时 '+fmt(elapsed)
    +'，评级'+rankOf(score/(TOTAL*2))[0]+'！来挑战➡️ '+location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>alert('战绩已复制，去群里粘贴吧！'),()=>alert(txt));
  } else { alert(txt); }
}

/* ---------- 排行榜页 ---------- */
async function showLB(mode){
  clearInterval(timerId); timerId=null;
  clearInterval(lbTimer); lbTimer=null;
  body.innerHTML='<div class="empty">排行榜加载中…</div>';
  let cloud=null, cloudOk=true;
  if(mode==='cloud'){
    try{ cloud=await fetchCloud(); }catch(e){ cloud=[]; cloudOk=false; }
    cloud = sortLB(mergeLB(cloud||[], localLB()));
  }
  renderLB(mode, cloud, cloudOk);
  // 全员榜实时刷新：每 5 秒拉一次云端并合并本机，无需手动刷新
  if(mode==='cloud'){
    lbTimer=setInterval(()=>pollLB(), 5000);
  }
}

async function pollLB(){
  try{
    const cloud=await fetchCloud();
    const merged=sortLB(mergeLB(cloud||[], localLB()));
    const rowsEl=document.getElementById('lbrows');
    const noteEl=document.getElementById('lbnote');
    if(rowsEl) rowsEl.innerHTML=lbRowsHTML(merged, 'cloud');
    if(noteEl) noteEl.innerHTML = merged.length
      ? ('共 '+merged.length+' 人参与 · 分数高者优先，同分用时短者领先')
      : '还没有人上榜<br>快去挑战，抢下第一名 🏆';
  }catch(e){ /* 云端暂不可达，保持当前显示 */ }
}

function renderLB(mode, cloud, cloudOk){
  let list, note;
  if(mode==='cloud'){
    list=cloud;
    note = list.length
      ? ('共 '+list.length+' 人参与 · 分数高者优先，同分用时短者领先'
         + (cloudOk?'':' · ⚠️ 云端暂不可达，当前显示本机与已同步成绩'))
      : '还没有人上榜<br>快去挑战，抢下第一名 🏆';
  } else {
    list=sortLB(localLB());
    note='只统计这台手机 / 电脑上玩过的成绩';
  }
  const top=list.slice(0,50);
  body.innerHTML = `
    <div class="tabs">
      <button class="${mode==='cloud'?'on':''}" onclick="showLB('cloud')">🏆 全员榜</button>
      <button class="${mode==='local'?'on':''}" onclick="showLB('local')">📱 本机榜</button>
    </div>
    <div class="lbhead">
      <div style="width:36px">名次</div>
      <div style="flex:1">姓名 / 门店</div>
      <div style="width:52px;text-align:right">成绩</div>
      <div style="width:62px;text-align:right">用时</div>
    </div>
    <div id="lbrows">${lbRowsHTML(top, mode)}</div>
    <div id="lbnote" class="tip">${note}</div>
    <button class="next" onclick="showStart()">开始挑战 / 再来一局</button>
    ${CLEAR_BTN}`;
}

function lbRowsHTML(list, mode){
  return list.length ? list.map((x,i)=>{
    const me = myRec && x.d===myRec.d;
    const tcls = i===0?'t1':(i===1?'t2':(i===2?'t3':''));
    const medal = i===0?'🥇':(i===1?'🥈':(i===2?'🥉':(i+1)));
    return `<div class="lbrow ${me?'me':''}">
      <div class="no ${tcls}">${medal}</div>
      <div class="nm">${esc(x.n)}${me?' <b style="color:#e6a919">(我)</b>':''}<span>${esc(x.sh)||'未填门店'}</span></div>
      <div class="sc">${x.s}分</div>
      <div class="tm">${fmt(x.t||0)}</div>
    </div>`;
  }).join('') : '<div class="empty">还没有人上榜<br>快去挑战，抢下第一名 🏆</div>';
}

/* ---------- 清除排行榜（管理用）---------- */
async function clearLeaderboard(){
  if(!confirm('确定要清空排行榜吗？\n本机榜单和云端榜单都会被清空，且无法恢复！')) return;
  // 1) 先清本机
  try{ localStorage.removeItem('cj_lb_local'); }catch(e){}
  // 2) 再清云端：用 no-cors 让 file:// 直接打开时也能把请求真正发出去
  let cloudMsg='云端清空请求已提交';
  try{
    await fetch(LB_URL,{method:'PUT',mode:'no-cors',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:LB_NAME,data:{v:1,list:[]}})});
  }catch(e){
    cloudMsg='⚠️ 云端清空请求发送失败（'
      + (location.protocol==='file:'
          ? '当前用 file:// 打开，浏览器拦截了对外部接口的写入。请用 http 方式打开本游戏（见下方说明）'
          : '网络或接口异常，可稍后重试')
      + '）';
  }
  alert('✅ 本机榜单已清空。'+cloudMsg+'。\n稍后点开排行榜即可看到最新结果。');
  showLB('cloud');
}

showStart();
</script>
</body>
